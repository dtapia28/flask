<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist familiar</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head><body><header class="bar"><a href="/" class="brand">Casa · Checklist</a>{% if current_user.is_authenticated %}<nav><a href="/today">Hoy</a><a href="/history">Historial</a>{% if current_user.role=='admin' %}<a href="/admin">Administración</a>{% endif %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="plain">Salir</button></form></nav>{% endif %}</header><main class="wrap">{% for m in get_flashed_messages() %}<p class="notice">{{m}}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
